# Configurazione globale dell'applicazione PrenotazioneViaggi
# Come richiesto dal progetto, il cambio di modalita' avviene qui,
# non con un menu a runtime.

# modalita: DEMO (tutto in memoria) oppure FULL (dati persistiti)
modalita=DEMO

# persistenza: FILE oppure DB (usata solo se modalita=FULL)
persistenza=FILE

# gui: JAVAFX oppure CLI
gui=JAVAFX
