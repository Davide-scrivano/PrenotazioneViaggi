# Configurazione globale dell'applicazione PrenotazioneViaggi

# modalita: DEMO (tutto in memoria) oppure FULL (dati persistenti)
modalita=DEMO

# persistenza: FILE oppure DB (usata solo se modalita=FULL)
persistenza=FILE

# gui: JAVAFX oppure CLI
gui=JAVAFX

# Percorsi usati quando persistenza=FILE
fileUtenti=fileData/utenti.txt
filePacchetti=fileData/pacchetti.txt
filePrenotazioni=fileData/prenotazioni.txt

# Parametri di connessione usati quando persistenza=DB.
# La password va inserita qui e non nel codice sorgente: questo file
# non deve essere pubblicato su un repository.
dbUrl=jdbc:mysql://localhost:3306/prenotazioneviaggi
dbUtente=root
dbPassword=
