# Proprieta' di connessione/analisi: messe qui (invece che passate a mano
# sulla riga di comando) perche' lo sonar-scanner 8.x su PowerShell non
# gestisce bene i "-Dchiave=valore" concatenati; qui non serve alcun
# escaping. Il token resta fuori da questo file (e' un segreto, non va
# committato) e si passa come unico argomento a sonar-scanner.
sonar.organization=davide-scrivano
sonar.projectKey=Davide-scrivano_PrenotazioneViaggi
sonar.sources=src
sonar.tests=test
sonar.java.binaries=bin
sonar.java.libraries=C:/Users/skskn/Downloads/openjfx-21.0.11_windows-x64_bin-sdk/javafx-sdk-21.0.11/lib/*.jar,C:/Users/skskn/Downloads/mysql-connector-j-9.7.0/mysql-connector-j-9.7.0/mysql-connector-j-9.7.0.jar
# Eclipse compila sorgenti e test nella stessa cartella di output (bin),
# quindi le classi di test stanno li'. Senza queste due proprieta' lo
# scanner avvisa che l'analisi dei test sara' meno precisa.
# I jar di JUnit non stanno nel progetto: Eclipse li prende dal proprio
# pool di plugin, quindi si punta li' con dei filtri invece di elencarli
# uno per uno (i numeri di versione cambierebbero a ogni aggiornamento).
sonar.java.test.binaries=bin
sonar.java.test.libraries=C:/Users/skskn/Downloads/openjfx-21.0.11_windows-x64_bin-sdk/javafx-sdk-21.0.11/lib/*.jar,\
  C:/Users/skskn/Downloads/mysql-connector-j-9.7.0/mysql-connector-j-9.7.0/mysql-connector-j-9.7.0.jar,\
  C:/Users/skskn/.p2/pool/plugins/junit-*.jar,\
  C:/Users/skskn/.p2/pool/plugins/org.junit*.jar,\
  C:/Users/skskn/.p2/pool/plugins/org.opentest4j*.jar,\
  C:/Users/skskn/.p2/pool/plugins/org.apiguardian*.jar,\
  C:/Users/skskn/.p2/pool/plugins/org.hamcrest*.jar
sonar.host.url=https://sonarcloud.io
#
# 1) GUI: i componenti grafici (colori, layout, stili) non vengono
# valutati nel giudizio del progetto, quindi non ha senso "ripulire"
# warning SonarCloud puramente estetici (letterali duplicati per stili
# CSS-like, magic number per padding e dimensioni delle finestre) che
# non riguardano la qualita' architetturale.
sonar.exclusions=src/gui/**

# 2) CLI: java:S106 ("Standard outputs should not be used directly to
# log anything") viene disattivata solo per InterfacciaCLI. Una Boundary
# a riga di comando DEVE stampare a console: e' la sua natura, non un
# difetto di design. Usare un Logger al suo posto sostituirebbe l'unico
# vero canale di interazione con l'utente CLI con dell'altro output
# non pensato per essere letto interattivamente.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e1.resourceKey=src/cli/InterfacciaCLI.java
